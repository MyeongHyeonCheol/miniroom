# Production-like stack: Caddy (HTTPS, one domain) -> backend + PostgreSQL. See docs/deploy.md.
# Local rehearsal: cd frontend && npm run build, then
#   docker compose -f compose.prod.yml up -d --build
# Separate project name: its own containers and volumes, never the dev database. Runs alongside the dev stack.
name: miniroom-prod

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-miniroom}
      POSTGRES_USER: ${POSTGRES_USER:-miniroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published port: only the backend reaches it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-miniroom}
      POSTGRES_USER: ${POSTGRES_USER:-miniroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET in .env}
      FRONTEND_URL: ${SITE_URL:-https://localhost}
      # Heap follows the container limit below, leaving room for metaspace and threads
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
      TZ: Asia/Seoul
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
    # No published port: X-Forwarded-* is trusted, so only Caddy may talk to it
    restart: unless-stopped

  web:
    image: caddy:2
    environment:
      SITE_HOST: ${SITE_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Built on the host (npm run build); rebuild the frontend without restarting anything
      - ./frontend/dist:/srv:ro
      # Certificates and Caddy's local CA: keep them so the browser trust survives restarts
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  caddy-data:
  caddy-config:
